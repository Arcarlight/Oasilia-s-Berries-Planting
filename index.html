<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/ui/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/ui/favicon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>菲洛若亚大陆 · 树果物语</title>
<meta name="description" content="一个只存在宝可梦的世界。沙漠蜻蜓欧亚西莉亚从繁盛之森开始种树果。">
<link rel="stylesheet" href="css/style.css?v=1792173180">
<script>
// 便于排查：页面上出了任何脚本错误，都塞进 __errors 并写进标题
window.__errors = [];
window.addEventListener("error", function (e) {
  window.__errors.push(String(e.message) + " @" + (e.filename || "") + ":" + (e.lineno || 0));
  document.title = "ERR: " + e.message;
});
window.addEventListener("unhandledrejection", function (e) {
  window.__errors.push("promise: " + String(e.reason));
  document.title = "ERR: " + e.reason;
});
</script>

</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">菲洛若亚大陆 · 树果物语</div>
    <div class="stat"><img class="ico ico-stat" src="assets/ui/stat-money.png" srcset="assets/ui/stat-money-2x.png 2x, assets/ui/stat-money-3x.png 3x" alt="">宝可元 <b id="uiMoney">₽0</b></div>
    <div class="stat"><img class="ico ico-stat" src="assets/ui/stat-rate.png" srcset="assets/ui/stat-rate-2x.png 2x, assets/ui/stat-rate-3x.png 3x" alt="">自动 <b id="uiRate">₽0</b>/秒</div>
    <div class="stat"><img class="ico ico-stat" src="assets/ui/stat-tp.png" srcset="assets/ui/stat-tp-2x.png 2x, assets/ui/stat-tp-3x.png 3x" alt="">天赋点 <b id="uiTp">0</b></div>
    <div class="stat"><img class="ico ico-stat" src="assets/ui/stat-region.png" srcset="assets/ui/stat-region-2x.png 2x, assets/ui/stat-region-3x.png 3x" alt=""><span id="uiRegion">繁盛之森</span></div>
    <div class="spacer"></div>
    <div class="sub" id="uiSaved">—</div>
    <button id="btnSettings" class="small"><img class="ico ico-stat" src="assets/ui/settings.png" srcset="assets/ui/settings-2x.png 2x, assets/ui/settings-3x.png 3x" alt="">设置</button>
  </header>

  <main id="layout">
    <section class="panel" id="farmPanel">
      <div class="panel-head">田地 <span class="sub" id="uiPlotInfo"></span></div>
      <div class="plots" id="uiPlots"></div>
      <div class="seed-picker" id="uiSeedPicker"></div>
    </section>

    <section class="panel">
      <nav id="tabs"></nav>
      <div id="tabBody"></div>
    </section>

    <section class="panel" id="sidePanel">
      <div class="panel-head">阿特拉斯 &amp; 日志</div>
      <div class="log" id="uiLog"></div>
    </section>
  </main>

  <footer id="bottombar">
    <button id="btnSell" class="big gold" data-act="sell" title="叫卖一次：把摊上最贵的几个生果吆喝出去，价钱比自动出货高两成半。手上没果子就卖不动。「掌力」天赋既加价、也让你一次能吆喝动更多。">叫卖 <span id="uiSellVal">₽0</span></button>
    <button id="btnWaterAll">浇水（全部田）</button>
    <button id="btnHarvestAll">收获全部</button>
    <div class="hint" id="uiHint"></div>
  </footer>
</div>

<div id="flash"></div>
<div id="overlay" class="hidden"></div>
<div id="toastWrap"></div>

<script src="src/core/state.js?v=1792173180"></script>
<script src="src/core/save.js?v=1792173180"></script>

<script src="src/ui/ui.js?v=1792173180"></script>
<script src="src/main.js?v=1792173180"></script>
</body>
</html>
